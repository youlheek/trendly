      maximum-pool-size: 10  # ?? ??? ? ??
      minimum-idle: 5  # ?? ?? ??? ??
      idle-timeout: 30000  # ??? ?? ?? ?? ??(ms)
      connection-timeout: 20000  # ??? ?? ?? ??(ms)
      max-lifetime: 1800000  # ??? ?? ??(ms)
      connection-test-query: SELECT 1  # ??? ??? ?? ??

  # JPA ??
  jpa:
    hibernate:
      ddl-auto: create  # ?????? ???? ????? ??
    database-platform: org.hibernate.dialect.MySQLDialect  # MySQL? ?? Hibernate ?? ??
