
# 서버 설정
server:
  port: ${SPRING_PORT:8080}  # ??????? ??? ?? ?? ??
  error:
    whitelabel:
      enabled: false  # Spring Boot ?? ?? ???(whitelabel error page) ????
  base-url: localhost
  url: http://localhost:8080
# ??? ?????? ??
spring:
  batch:
    job:
      enabled: false

  application:
    name: trendly  # 애플리케이션 이름 설정
    mvc:
      pathmatch:
        matching-strategy: ant_path_matcher    # 원본 값 사용
  datasource:
    url: jdbc:mysql://localhost:3306/trendly?useSSL=false&useUnicode=true&allowPublicKeyRetrieval=true  # MySQL ?????? ?? URL
    username: ${PUBLIC_NAME:trendly}
    password: ${PUBLIC_PASSWORD:rootroot}
    driver-class-name: com.mysql.cj.jdbc.Driver  # JDBC ???? ???
    hikari:  # HikariCP(??? ?) ??
      pool-name: HikariCP  # ??? ? ??
      maximum-pool-size: 10  # ?? ??? ? ??
      minimum-idle: 5  # ?? ?? ??? ??
      idle-timeout: 30000  # ??? ?? ?? ?? ??(ms)
      connection-timeout: 20000  # ??? ?? ?? ??(ms)
      max-lifetime: 1800000  # ??? ?? ??(ms)
      connection-test-query: SELECT 1  # ??? ??? ?? ??

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update  # ?????? ???? ????? ??
    database-platform: org.hibernate.dialect.MySQLDialect  # MySQL? ?? Hibernate ?? ??
    show-sql: true  # SQL ?? ?? ???
    properties:
      hibernate:
        format_sql: true  # SQL ?? ?? ??(???? ??)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 0ff4f0cc878339e75d6a7f55b88fa027
            redirect-uri: http://localhost:8080/auth/kakao/callback
    #  # MongoDB ??
    #  data:
    #    mongodb:
    #      uri: mongodb://localhost:27017/adarticle-db  # MongoDB 연결 URI

    # Redis ??
  redis:
    host: 54.180.63.180  # Redis ???
    port: ${REDIS_PORT:6379}  # Redis ?? ??

# RabbitMQ ??
rabbitmq:
  host: localhost  # .env?? ????? ???
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_DEFAULT_USER}
  password: ${PUBLIC_PASSWORD}  # .env? ???? ?? ??

jwt:
  secret: testSecretKey20230327testSecretKey20230327testSecretKey20230327
  access-token:
#    expiration: 3600000  # 1시간 (1h = 60 * 60 * 1000ms)
    expiration: 86400000 # 24시간 (24h = 24 * 60 * 60 * 1000ms)
  refresh-token:
    expiration: 86400000 # 24시간 (24h = 24 * 60 * 60 * 1000ms)

# 로그 설정
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.web.socket.handler: TRACE
    org.hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    com.rebootcrew.trendly: DEBUG